floxim: 1
name: build-milestone
description: >
  Floxim's own build loop for one milestone of docs/milestones.md: plan, implement with
  tests, check, review on a second harness, and commit after a person approves.

inputs:
  milestone:
    type: string
    required: true
    description: Milestone ID from docs/milestones.md, e.g. M4c.

defaults:
  max_visits: 6
  agent:
    harness: claude
    timeout: 45m
    budget: {usd: 8}

limits:
  max_duration: 6h
  budget: {usd: 30}

nodes:
  plan:
    type: agent
    permissions: read-only
    prompt_file: prompts/plan-milestone.md
    output_schema: schemas/milestone-plan.json
    next:
      - when: nodes.plan.output.status == "ready"
        to: implement
      - to: fail
        reason: "Planner is blocked: ${{ nodes.plan.output.summary }}"

  implement:
    type: agent
    session: continue
    allow_tools: ["Bash(uv run:*)", "Bash(git diff:*)", "Bash(git status:*)"]
    prompt_file: prompts/implement-milestone.md
    next: check

  check:
    type: shell
    run: uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest -q
    timeout: 20m
    on_error: continue
    next:
      - when: nodes.check.exit_code == 0
        to: review
      - when: visits.implement < 4
        to: implement
      - to: escalate

  review:
    type: agent
    harness: codex
    permissions: read-only
    prompt_file: prompts/review-milestone.md
    output_schema: schemas/review.json
    next:
      - when: nodes.review.output.verdict == "approve"
        to: approve
      - when: visits.implement < 4
        to: implement
      - to: escalate

  approve:
    type: human
    message: |
      ${{ inputs.milestone }} is implemented, checked and reviewed.
      Commit it?
    show:
      - "Plan: ${{ nodes.plan.output.summary }}"
      - "Estimated spend (USD): ${{ round(run.budget.usd_spent, 2) }}"
    choices: [commit, revise, stop]
    input: text
    next:
      - when: nodes.approve.choice == "commit"
        to: commit
      - when: nodes.approve.choice == "revise"
        to: implement
      - to: end

  commit:
    type: shell
    env:
      MILESTONE: ${{ inputs.milestone }}
      SUMMARY: ${{ nodes.plan.output.summary }}
    run: |
      git add -A
      git commit -m "$MILESTONE: $SUMMARY"

  escalate:
    type: human
    message: |
      ${{ inputs.milestone }} still fails its checks or review. Fix it by hand, then
      choose "retry" to run the checks again.
    show:
      - "${{ tail(nodes.check.stdout, 30) }}"
    choices: [retry, give_up]
    next:
      - when: nodes.escalate.choice == "retry"
        to: check
      - to: fail
        reason: Gave up on ${{ inputs.milestone }}.

outputs:
  summary: ${{ nodes.plan.output.summary }}
