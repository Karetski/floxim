name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        id: py310
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: uv build

      - name: The wheel is pure Python
        run: ls dist/floxim-*-py3-none-any.whl

      - name: Every runtime dependency is pure Python
        run: |
          uv venv /tmp/pure
          uv pip install --python /tmp/pure dist/*.whl
          /tmp/pure/bin/python tools/check_pure_python.py

      - name: Installs with pipx
        run: |
          pipx install dist/*.whl
          floxim --version
          flx --version
          pipx uninstall floxim

      - name: Installs with uv tool
        run: |
          uv tool install dist/*.whl
          floxim --version
          flx --version

      - name: Zipapp runs on Python 3.10
        run: |
          uv run python tools/build_zipapp.py dist/floxim-*.whl dist/floxim.pyz
          "${{ steps.py310.outputs.python-path }}" dist/floxim.pyz --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
