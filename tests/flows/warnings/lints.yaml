name: lints
limits:
  max_steps: none
  max_duration: none
  budget: {usd: none, tokens: none}
nodes:
  plan:
    type: agent
    harness: fake
    permissions: full
    prompt: "Plan it. Previous: {{ nodes.plan.text }}"
    next: build
  build:
    type: shell
    run: make ${{ nodes.plan.text }} ${{ shq(nodes.plan.text) }}
    next: deploy
  deploy:
    type: shell
    args: [git, push, origin, HEAD]
    next: approve
  approve:
    type: human
    message: Pushed. Merge?
    choices: [merge, stop]
    next:
      - when: nodes.approve.choice == "merge"
        to: merge
      - to: end
  merge:
    type: shell
    run: gh pr merge --squash
