name: graph-warnings
nodes:
  test:
    type: shell
    run: make test
    next:
      - when: nodes.test.exit_code == 0
        to: end
      - when: nodes.fix.outcome == "succeeded"
        to: fix
  fix:
    type: agent
    harness: fake
    prompt: "Fix: ${{ nodes.orphan.stdout }} ${{ nodes.test.output.detail }}"
    next: test
  orphan:
    type: shell
    run: echo never
