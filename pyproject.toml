[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcflow"
dynamic = ["version"]
description = "Terminal-first, harness-agnostic workflow orchestrator for AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexey Karetski" }]
requires-python = ">=3.10"
# Runtime dependencies must be pure Python (ADR 0001); CI enforces it.
dependencies = [
    "fastjsonschema>=2.19",
    "ruamel-yaml>=0.19",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/Karetski/arcflow"
Issues = "https://github.com/Karetski/arcflow/issues"

[project.scripts]
arcflow = "arcflow.cli:run"
arcf = "arcflow.cli:run"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/arcflow/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Docs hold illustrative snippets; .claude/ is vendored from agentkit.
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Docs and messages use typographic dashes and arrows on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "tools"]
mypy_path = ["tools"]

[[tool.mypy.overrides]]
module = ["fastjsonschema", "fastjsonschema.*"]
ignore_missing_imports = true
